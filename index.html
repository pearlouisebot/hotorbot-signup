<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot or Bot - Face Recording Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .video-container {
            position: relative;
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin: 20px 0;
        }

        button {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .record-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
        }

        .record-btn.recording {
            background: linear-gradient(45deg, #ff3333, #ff5555);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .stop-btn {
            background: linear-gradient(45deg, #4ecdc4, #44d9cc);
        }

        .upload-btn {
            background: linear-gradient(45deg, #4ecdc4, #44d9cc);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: 600;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .email-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            margin: 15px 0;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .email-input:focus {
            border-color: #667eea;
        }

        .progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #4ecdc4, #44d9cc);
            width: 0%;
            transition: width 0.3s ease;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Hot or Bot</h1>
        <p class="subtitle">Record a quick video to join our community</p>
        
        <div class="video-container">
            <video id="videoElement" autoplay muted playsinline></video>
        </div>
        
        <input type="email" id="emailInput" class="email-input" placeholder="Enter your email address" required>
        
        <div class="controls">
            <button id="startCamera" onclick="startCamera()">Start Camera</button>
            <button id="recordBtn" onclick="toggleRecording()" disabled>Start Recording</button>
            <button id="stopBtn" onclick="stopRecording()" disabled style="display: none;">Stop Recording</button>
            <button id="uploadBtn" onclick="uploadVideo()" disabled style="display: none;">Submit Video</button>
        </div>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="progress" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="footer">
            <p>Your video helps us build a better community experience</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase configuration
        const supabaseUrl = 'https://dvxkihjlkilmapzaoasg.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eGtpaGpsa2lsbWFwemFvYXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjYwMDE4MzcsImV4cCI6MjA0MTU3NzgzN30.Hrf8LbJBNPBz4_k5KR5_kJhzv1FU7F6-CvuiUkYJc1Y';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let isRecording = false;

        const videoElement = document.getElementById('videoElement');
        const emailInput = document.getElementById('emailInput');
        const startCameraBtn = document.getElementById('startCamera');
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: 640, 
                        height: 480,
                        facingMode: 'user'
                    }, 
                    audio: true 
                });
                videoElement.srcObject = stream;
                
                startCameraBtn.style.display = 'none';
                recordBtn.disabled = false;
                
                showStatus('Camera ready! Click "Start Recording" when you\'re ready.', 'info');
            } catch (err) {
                showStatus('Error accessing camera. Please ensure you have a camera connected and permissions granted.', 'error');
                console.error('Error accessing media devices:', err);
            }
        }

        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            }
        }

        async function startRecording() {
            if (!emailInput.value || !emailInput.checkValidity()) {
                showStatus('Please enter a valid email address first.', 'error');
                emailInput.focus();
                return;
            }

            try {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp8,opus'
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    showStatus('Recording complete! Click "Submit Video" to upload.', 'success');
                    recordBtn.style.display = 'none';
                    stopBtn.style.display = 'none';
                    uploadBtn.style.display = 'inline-block';
                    uploadBtn.disabled = false;
                };

                mediaRecorder.start();
                isRecording = true;
                
                recordBtn.textContent = 'Recording...';
                recordBtn.classList.add('recording');
                recordBtn.disabled = true;
                stopBtn.style.display = 'inline-block';
                stopBtn.disabled = false;
                
                showStatus('Recording... Speak naturally for 10-30 seconds.', 'info');
                
                // Auto-stop after 30 seconds
                setTimeout(() => {
                    if (isRecording) {
                        stopRecording();
                    }
                }, 30000);
                
            } catch (err) {
                showStatus('Error starting recording. Please try again.', 'error');
                console.error('Error starting recording:', err);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                stopBtn.disabled = true;
            }
        }

        async function uploadVideo() {
            if (recordedChunks.length === 0) {
                showStatus('No recording found. Please record a video first.', 'error');
                return;
            }

            const email = emailInput.value.trim();
            if (!email) {
                showStatus('Please enter your email address.', 'error');
                return;
            }

            try {
                uploadBtn.disabled = true;
                showStatus('Uploading your video...', 'info');
                progressContainer.style.display = 'block';
                
                // Create video blob
                const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const timestamp = Date.now();
                const filename = `signup_${email.replace('@', '_')}_${timestamp}.webm`;

                // Upload to Supabase Storage
                progressBar.style.width = '30%';
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('hotorbot-videos')
                    .upload(filename, videoBlob, {
                        contentType: 'video/webm'
                    });

                if (uploadError) {
                    throw new Error(`Upload failed: ${uploadError.message}`);
                }

                progressBar.style.width = '70%';

                // Get public URL
                const { data: urlData } = supabase.storage
                    .from('hotorbot-videos')
                    .getPublicUrl(filename);

                // Save to database
                const { data: dbData, error: dbError } = await supabase
                    .from('hotorbot_user_videos')
                    .insert([{
                        email: email,
                        video_url: urlData.publicUrl,
                        filename: filename,
                        created_at: new Date().toISOString(),
                        file_size: videoBlob.size,
                        status: 'uploaded'
                    }]);

                if (dbError) {
                    throw new Error(`Database error: ${dbError.message}`);
                }

                progressBar.style.width = '100%';
                
                showStatus(`Success! Thanks for signing up, ${email}. We'll be in touch soon! 🎉`, 'success');
                
                // Clean up
                uploadBtn.style.display = 'none';
                emailInput.disabled = true;
                
                // Stop camera
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 2000);

            } catch (error) {
                showStatus(`Upload failed: ${error.message}. Please try again.`, 'error');
                uploadBtn.disabled = false;
                progressBar.style.width = '0%';
                console.error('Upload error:', error);
            }
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        // Initialize
        showStatus('Click "Start Camera" to begin your video signup', 'info');
    </script>
</body>
</html>
